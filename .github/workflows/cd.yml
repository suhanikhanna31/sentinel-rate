name: CD

# Runs after CI succeeds on main, or when a version tag is pushed.
# Publishes both service images to GitHub Container Registry (GHCR).
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sentinel-rate
            context: .
          - name: sentinel-agent
            context: ./agent-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Placeholder deploy job: wire this up to your actual target (Render,
  # a k8s cluster via `kubectl set image`, Argo CD, etc). Kept as a manual
  # approval gate (environment protection rule) rather than auto-deploying,
  # since this repo's live demo is on Render's free tier.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy notification
        run: echo "Images published to GHCR. Trigger your deploy target here (Render/kubectl/ArgoCD)."
