# Copy to agent-secret.yaml (gitignored), fill in the real key, then:
#   kubectl apply -f k8s/agent-secret.yaml
# The Deployment marks this key `optional: true`, so the agent works fine
# in its offline heuristic mode if this Secret is never created.
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-agent-secrets
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_ME"
